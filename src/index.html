<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>eikon parcel starter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="scss/main.scss" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="cta">
      <div class="container primary-button">
        <div class="container-button">
          <button class="button">Label</button>
          <button class="button small">Label</button>
        </div>
        <div class="container-button">
          <button class="button" disabled>Label</button>
          <button class="button small" disabled>Label</button>
        </div>
      </div>
      <div class="container secondary-button">
        <div class="container-button">
          <button class="button">Label</button>
          <button class="button small">Label</button>
        </div>
        <div class="container-button">
          <button class="button" disabled>Label</button>
          <button class="button small" disabled>Label</button>
        </div>
      </div>
    </div>
    <div class="card">
      <img src="./assets/image.svg" alt="Card Image" />
      <div class="Content">
        <div class="Title">
          <h2>San Francisco</h2>
          <p>Premium economy</p>
        </div>
        <div class="Informations"></div>
      </div>
    </div>

    <script src="js/main.js" type="module"></script>
  </body>
</html>
